format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

meta:
  bitrise.io:
    stack: osx-xcode-latest-stable

workflows:
  build_ipa:
    # No push trigger: the old one named a branch of a community fork (codex/fix-ipad-color). Start it by hand.
    steps:
      - git-clone@8: {}
      - script@1:
          title: Build Tuxedo IPA
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash ci/build-bitrise.sh

# The virtio sound card's Master control is the device's volume: at login WirePlumber must not
# set it to a stored or default level (scripts/henge/keep-device-volume.lua).
wireplumber.components = [
  {
    name = henge/keep-device-volume.lua, type = script/lua
    provides = custom.henge-keep-device-volume
  }
]

wireplumber.profiles = {
  main = {
    custom.henge-keep-device-volume = required
  }
}

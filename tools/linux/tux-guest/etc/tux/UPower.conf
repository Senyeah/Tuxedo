# UPower 1.90's defaults, except that nothing happens at a critical battery: the battery is the
# device's, and the guest must not power off for it. Plasma still shows its low and critical notices.
# Read through UPOWER_CONF_FILE_NAME (upower.service.d/tux.conf), so the package's own file stays as it is.
[UPower]
EnableWattsUpPro=false
NoPollBatteries=false
IgnoreLid=false
UsePercentageForPolicy=true
PercentageLow=20.0
PercentageCritical=5.0
PercentageAction=2.0
TimeLow=1200
TimeCritical=300
TimeAction=120
AllowRiskyCriticalPowerAction=true
CriticalPowerAction=Ignore

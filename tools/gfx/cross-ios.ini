# Meson cross file for iOS arm64 (device). Min OS 17.0 matches IOS_CC in the Makefile.
[binaries]
c = ['xcrun', '--sdk', 'iphoneos', 'clang']
cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
objc = ['xcrun', '--sdk', 'iphoneos', 'clang']
ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
strip = ['xcrun', '--sdk', 'iphoneos', 'strip', '-x']
pkg-config = ['pkg-config']

[built-in options]
c_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0']
c_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0']
objc_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0']
objc_link_args = ['-arch', 'arm64', '-miphoneos-version-min=17.0']

[properties]
needs_exe_wrapper = true
# SDK 27 declares these; meson would wrongly detect them for older targets
has_function_pipe2 = false
has_function_dup3 = false

[host_machine]
system = 'darwin'
subsystem = 'ios'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

# Meson cross file for the iOS simulator on arm64. Min OS 17.0 matches IOS_CC in the Makefile.
[binaries]
c = ['xcrun', '--sdk', 'iphonesimulator', 'clang']
cpp = ['xcrun', '--sdk', 'iphonesimulator', 'clang++']
objc = ['xcrun', '--sdk', 'iphonesimulator', 'clang']
ar = ['xcrun', '--sdk', 'iphonesimulator', 'ar']
strip = ['xcrun', '--sdk', 'iphonesimulator', 'strip', '-x']
pkg-config = ['pkg-config']

[built-in options]
c_args = ['-arch', 'arm64', '-target', 'arm64-apple-ios17.0-simulator']
c_link_args = ['-arch', 'arm64', '-target', 'arm64-apple-ios17.0-simulator']
objc_args = ['-arch', 'arm64', '-target', 'arm64-apple-ios17.0-simulator']
objc_link_args = ['-arch', 'arm64', '-target', 'arm64-apple-ios17.0-simulator']

[properties]
needs_exe_wrapper = true
# SDK 27 declares these; meson would wrongly detect them for older targets
has_function_pipe2 = false
has_function_dup3 = false

[host_machine]
system = 'darwin'
subsystem = 'ios-simulator'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

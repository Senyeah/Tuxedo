# Meson cross file for macOS arm64. Min OS 15.2 matches the Makefile CFLAGS.
[binaries]
c = ['xcrun', '--sdk', 'macosx', 'clang']
cpp = ['xcrun', '--sdk', 'macosx', 'clang++']
objc = ['xcrun', '--sdk', 'macosx', 'clang']
ar = ['xcrun', '--sdk', 'macosx', 'ar']
strip = ['xcrun', '--sdk', 'macosx', 'strip', '-x']
pkg-config = ['pkg-config']

[built-in options]
c_args = ['-arch', 'arm64', '-mmacosx-version-min=15.2']
c_link_args = ['-arch', 'arm64', '-mmacosx-version-min=15.2']
objc_args = ['-arch', 'arm64', '-mmacosx-version-min=15.2']
objc_link_args = ['-arch', 'arm64', '-mmacosx-version-min=15.2']

[properties]
needs_exe_wrapper = true
# SDK 27 declares these; meson would wrongly detect them for older targets
has_function_pipe2 = false
has_function_dup3 = false

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

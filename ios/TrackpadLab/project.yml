# Trackpad Lab: the external-display trackpad surface alone, with no machine (docs/external-trackpad-plan.md).
# Its own project, so that Henge's project does not change before the owner approves the surface.
name: TrackpadLab
options:
  bundleIdPrefix: nz.jackgreenhill
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "5.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEVELOPMENT_TEAM: BPWS3F8T7H
    CODE_SIGN_STYLE: Automatic

targets:
  TrackpadLab:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "Makefile"
          - "TrackpadLab.xcodeproj/**"
          - ".gitignore"
          - "Info.plist"
      - path: ../Pad
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Trackpad Lab
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.jackgreenhill.henge.trackpadlab
        PRODUCT_NAME: TrackpadLab
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

name: Tuxedo
options:
  bundleIdPrefix: com.henge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The console view's terminal (MIT). Pinned exactly; its licence is in Tuxedo/Resources/legal.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1

settings:
  base:
    # The app and its JIT helper follow this together (the helper's id sits under the app's).
    TUX_BUNDLE_IDENTIFIER: com.henge.app
    # The app's entitlements file. Override on the xcodebuild command line (the JIT helper doesn't use it, so a
    # personal team can sign the app with fewer entitlements without touching the helper).
    TUX_ENTITLEMENTS: Tuxedo/Tuxedo.entitlements
    # Graphics acceleration (A9) is opt-in: TUX_GFX=1 builds the engine with GFX=1 and links the libraries that
    # tools/gfx/build-deps.sh put in TUX_GFX_DIR. sim_build.sh and package_ipa.sh set both (ios/scripts/gfx_env.sh);
    # a build without them, such as CI, has no acceleration.
    TUX_GFX: ""
    TUX_GFX_DIR: $(SRCROOT)/../build/gfx
    TUX_GFX_LIBS_: ""
    TUX_GFX_LIBS_1: "$(TUX_GFX_DIR)/$(TUX_GFX_PLATFORM)/lib/libvirglrenderer.a $(TUX_GFX_DIR)/$(TUX_GFX_PLATFORM)/lib/libepoxy.a $(TUX_GFX_DIR)/$(TUX_GFX_PLATFORM)/lib/libEGL.a $(TUX_GFX_DIR)/$(TUX_GFX_PLATFORM)/lib/libGLESv2.a -framework VideoToolbox -framework CoreMedia -framework CoreVideo"
    # The simulator's guest network: TUX_SIM_NET=1 links the simulator builds of libslirp and glib in
    # TUX_SIM_NET_ROOT (tools/build_sim_net.sh). sim_build.sh sets both when they exist; else net_stub.c.
    TUX_SIM_NET: ""
    TUX_SIM_NET_ROOT: ""
    TUX_SIM_NET_LIBS_: ""
    TUX_SIM_NET_LIBS_1: "-L$(TUX_SIM_NET_ROOT)/lib -lslirp -lglib-2.0 -lintl -lpcre2-8"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "2"
    CLANG_C_LANGUAGE_STANDARD: c11

targets:
  Tuxedo:
    type: application
    platform: iOS
    sources:
      - path: Tuxedo
        excludes:
          - "Resources/**"
          - "Info.plist"
          - "Tuxedo.entitlements"
          - "Tuxedo.personal.entitlements"
          - "AppIcon.icon/**"
          - "AppIcon.icon"
      - path: Tuxedo/Resources
        buildPhase: resources
      # Icon Composer's document: the app icon, which iOS renders in Liquid Glass.
      - path: Tuxedo/AppIcon.icon
        type: file
        buildPhase: resources
      # The messages the app and its JIT helper exchange.
      - path: TuxJITHelper/TuxJITMessages.swift
      # The trackpad's surface (ios/Pad).
      - path: Pad
    settings:
      base:
        TUX_GFX_PLATFORM: ios
        PRODUCT_BUNDLE_IDENTIFIER: $(TUX_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Tuxedo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Tuxedo/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(TUX_ENTITLEMENTS)
        SWIFT_OBJC_BRIDGING_HEADER: Tuxedo/TuxBridge.h
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core"
          - "$(SRCROOT)/../host"
          - "$(SRCROOT)/../devices"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/ios"
          - "$(SRCROOT)/deps/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          # The engine (make ios-lib) and what its network needs (scripts/fetch_deps.sh).
          - "-ltuxvm"
          # The renderer behind Graphics acceleration (A9), when TUX_GFX=1.
          - "$(TUX_GFX_LIBS_$(TUX_GFX))"
          - "-lc++"
          - "-framework"
          - "QuartzCore"
          - "-lslirp"
          - "-lglib-2.0"
          - "-lintl"
          - "-lpcre2-8"
          - "-liconv"
          - "-lresolv"
          # On-device pairing for Built-in StikJIT (from Husk's src/rppairing-ios).
          - "-lhusk_rppairing"
          - "-framework"
          - "Metal"
          - "-framework"
          - "IOSurface"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "AVFAudio"
          - "-framework"
          - "CoreFoundation"
          # hvcodec, for a machine's Video encode setting (host/vcodec.m).
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
    dependencies:
      - package: SwiftTerm
      # Built-in StikJIT's debugger process. Embedded into PlugIns/.
      - target: TuxJITHelper
    preBuildScripts:
      - name: Build the engine
        script: |
          set -e
          cd "$SRCROOT/.."
          make ios-lib ${TUX_GFX:+GFX=1}
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed StikJIT
        # As in Husk: the helper links StikJIT; it lives in the app's Frameworks
        # with a minimal Info.plist (installd refuses one without), signed here.
        script: |
          set -e
          SRC="$SRCROOT/deps/StikJIT.xcframework/ios-arm64/StikJIT.framework"
          DST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/StikJIT.framework"
          rm -rf "$DST"
          mkdir -p "$(dirname "$DST")"
          ditto "$SRC" "$DST"
          rm -rf "$DST/Headers" "$DST/Modules"
          PLIST="$DST/Info.plist"
          if [ ! -f "$PLIST" ]; then
            plutil -create xml1 "$PLIST"
            plutil -insert CFBundleIdentifier -string "$PRODUCT_BUNDLE_IDENTIFIER.StikJIT" "$PLIST"
            plutil -insert CFBundleExecutable -string StikJIT "$PLIST"
            plutil -insert CFBundleName -string StikJIT "$PLIST"
            plutil -insert CFBundlePackageType -string FMWK "$PLIST"
            plutil -insert CFBundleInfoDictionaryVersion -string 6.0 "$PLIST"
            plutil -insert CFBundleShortVersionString -string 1.9.0 "$PLIST"
            plutil -insert CFBundleVersion -string 1.9.0 "$PLIST"
            plutil -insert MinimumOSVersion -string 17.4 "$PLIST"
            plutil -insert CFBundleSupportedPlatforms -array "$PLIST"
            plutil -insert CFBundleSupportedPlatforms.0 -string iPhoneOS "$PLIST"
          fi
          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] && [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DST"
          fi
        basedOnDependencyAnalysis: false

  # Built-in StikJIT's debugger (Husk docs/06-built-in-jit.md): a process cannot
  # debug itself, so StikJIT runs here and attaches to the app. iOS 26 and later.
  TuxJITHelper:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TuxJITHelper
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TUX_BUNDLE_IDENTIFIER).JITHelper
        INFOPLIST_FILE: TuxJITHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../Frameworks"
    dependencies:
      # StikJIT 1.9.0 (MPL-2.0, with idevice under MIT), unmodified; embedded by the app's Embed StikJIT.
      - framework: deps/StikJIT.xcframework
        embed: false

  # The app for the iOS Simulator (ios/scripts/sim_build.sh): no JIT helper, no StikJIT, and the network and pairing
  # libraries stubbed. Its engine is built apart, in build/ios-sim. The JIT region is made in-process (JITBootstrap).
  TuxSim:
    type: application
    platform: iOS
    sources:
      - path: Tuxedo
        excludes:
          - "Resources/**"
          - "Info.plist"
          - "Tuxedo.entitlements"
          - "Tuxedo.personal.entitlements"
          - "AppIcon.icon/**"
          - "AppIcon.icon"
      - path: Tuxedo/Resources
        buildPhase: resources
      - path: Tuxedo/AppIcon.icon
        type: file
        buildPhase: resources
      - path: TuxJITHelper/TuxJITMessages.swift
      - path: Pad
      - path: TuxSim/sim_stubs.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TUX_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Tuxedo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TUX_GFX_PLATFORM: sim
        SDKROOT: iphonesimulator
        SUPPORTED_PLATFORMS: iphonesimulator
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        INFOPLIST_FILE: Tuxedo/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Tuxedo/TuxBridge.h
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core"
          - "$(SRCROOT)/../host"
          - "$(SRCROOT)/../devices"
          - "$(SRCROOT)/Tuxedo/Native"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/ios-sim"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ltuxvm"
          - "$(TUX_GFX_LIBS_$(TUX_GFX))"
          - "$(TUX_SIM_NET_LIBS_$(TUX_SIM_NET))"
          - "-lc++"
          - "-framework"
          - "QuartzCore"
          - "-liconv"
          - "-lresolv"
          - "-framework"
          - "Metal"
          - "-framework"
          - "IOSurface"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "AVFAudio"
          - "-framework"
          - "CoreFoundation"
          # hvcodec, for a machine's Video encode setting (host/vcodec.m).
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
    dependencies:
      - package: SwiftTerm
    preBuildScripts:
      - name: Build the simulator engine
        script: |
          set -e
          cd "$SRCROOT/.."
          make ios-sim-lib ${TUX_GFX:+GFX=1} ${TUX_SIM_NET:+SIM_NET_ROOT=$TUX_SIM_NET_ROOT}
        basedOnDependencyAnalysis: false
